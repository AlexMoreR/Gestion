name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Antes de construir la imagen: si los tipos o las pruebas fallan, no se
  # construye ni se publica nada, y por lo tanto no se despliega.
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Direcciones falsas a proposito: las pruebas no deben tocar ninguna base real.
      DATABASE_URL: postgresql://ci:no-usar@127.0.0.1:1/no_usar
      DIRECT_URL: postgresql://ci:no-usar@127.0.0.1:1/no_usar
      # Las pruebas no usan Chromium; evita descargarlo en cada run.
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Revisar tipos
        run: npx tsc --noEmit

      - name: Correr pruebas
        run: npm test

  build-and-push:
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/alexmorer/gestion:latest
          # Cachea las capas entre builds: si no cambian package*.json, el paso
          # lento de "npm ci" se reutiliza y solo se recompila lo que cambio.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer redeploy
        env:
          WEBHOOK: ${{ secrets.PORTAINER_GESTION }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            echo "Avisando a Portainer para redesplegar..."
            curl -fsSL -X POST "$WEBHOOK"
          else
            echo "PORTAINER_GESTION no configurado; se omite el redeploy automatico."
          fi
