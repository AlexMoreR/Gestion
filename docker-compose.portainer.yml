version: "3.9"

services:
  magilus_app:
    image: ghcr.io/alexmorer/gestion:latest
    volumes:
      - magilus_uploads:/app/public/uploads
    environment:
      NODE_ENV: "production"
      AUTH_URL: "https://magilus.com"
      NEXT_PUBLIC_SITE_URL: "https://magilus.com"
      DATABASE_URL: "${DATABASE_URL}"
      AUTH_SECRET: "${AUTH_SECRET}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      # Opcional: si se define, sobreescribe el token del informe; si no, se
      # deriva de AUTH_SECRET automaticamente.
      MONTHLY_REPORT_TOKEN: "${MONTHLY_REPORT_TOKEN}"
      # Llave del servidor MCP de solo lectura (/api/mcp) para el asesor de IA.
      # Minimo 24 caracteres; sin ella el endpoint responde 401 a todo.
      MCP_API_KEY: "${MCP_API_KEY}"
      # Gastos por MCP (voz/chat): la foto del soporte es opcional y no se revisa, asi que ya no
      # se usa ANTHROPIC_API_KEY. Opcional: correo
      # del usuario que queda como creador del gasto (si no, el administrador mas antiguo).
      MCP_GASTOS_USUARIO_EMAIL: "${MCP_GASTOS_USUARIO_EMAIL}"
      # Fase 6, boton "Traer de Drive": direccion de la API de NETMAGI (crm-api, sin "/" final) y
      # la llave compartida (la misma GESTION_FOTOS_KEY en NETMAGI). Sin ellas el boton avisa
      # "Falta configurar NETMAGI" y la tienda sigue igual.
      NETMAGI_FOTOS_URL: "${NETMAGI_FOTOS_URL}"
      GESTION_FOTOS_KEY: "${GESTION_FOTOS_KEY}"
      # Dudas del catalogo (/dudas). Opcionales: sin DUDAS_SESSION_SECRET la firma de la sesion se
      # deriva de AUTH_SECRET; sin DUDAS_API_KEY, GET /api/dudas/respuestas usa CATALOGO_API_KEY o
      # MCP_API_KEY. Cambiar DUDAS_SESSION_SECRET cierra todas las sesiones de /dudas.
      DUDAS_SESSION_SECRET: "${DUDAS_SESSION_SECRET}"
      DUDAS_API_KEY: "${DUDAS_API_KEY}"
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.magilus.rule=Host(`magilus.com`) || Host(`www.magilus.com`)
        - traefik.http.routers.magilus.entrypoints=websecure
        - traefik.http.routers.magilus.tls=true
        - traefik.http.routers.magilus.tls.certresolver=letsencryptresolver
        - traefik.http.routers.magilus.service=magilus
        - traefik.http.services.magilus.loadbalancer.server.port=3000
        - traefik.http.services.magilus.loadbalancer.passHostHeader=true

networks:
  minha_rede:
    external: true

volumes:
  magilus_uploads:
